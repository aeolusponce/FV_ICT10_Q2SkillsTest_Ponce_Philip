
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>

    <!-- my bootstrap styling-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- my python helper-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #316083;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin-top: 70px;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: #316083;
        }

        .btn-primary {
            background-color: #316083;
            border-color: #316083;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-container">

            <h1 class="text-center mb-4">Non-Metal Elements</h1>

            <!-- input the element symbol to search-->
            <div class="mb-3">
                <label for="element1" class="form-label fw-semibold">Element Symbol</label>
                <input type="text" class="form-control" id="element1" placeholder="Enter element symbol (e.g. H)">
            </div>

            <!-- my button to search for an element-->
            <button type="button" class="btn btn-primary w-100" py-click="search_element">Search Element</button>

            <!-- this displays the showcase result -->
            <div class="mt-4">
                <h5 class="fw-bold">Showcase Result</h5>

                <p><b>Element Symbol:</b> <span id="symbol"></span></p>
                <p><b>Element Name:</b> <span id="name"></span></p>
                <p><b>Atomic Number:</b> <span id="number"></span></p>
                <p><b>Atomic Mass:</b> <span id="mass"></span></p>
            </div>

        </div>
    </div>

    <!-- my python script source coming from main.py -->
    <py-script src="main.py"></py-script>
</body>
</html>
